[profile.default]
fail-fast = true
retries = 0
test-threads = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 2 }
status-level = "pass"
final-status-level = "slow"

[profile.ci]
fail-fast = true
retries = 0
test-threads = "num-cpus"
slow-timeout = { period = "90s", terminate-after = 2 }
status-level = "pass"
final-status-level = "fail"
